[package]
name = "hermes-desktop-rust"
version = "0.1.0"
description = "A Rust host for the upstream Hermes Desktop workspace"
authors = ["William Bohn"]
license = "MIT"
repository = "https://github.com/willbohn/hermes-desktop-rust"
edition = "2024"
rust-version = "1.90"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-window-state", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:webkit2gtk", "dep:jsc"]

[[bin]]
name = "hermes-desktop-rust"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2.7", optional = true }

[dependencies]
url = "2.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
clap = { version = "4.5", features = ["derive"] }
tauri = { version = "2.12", optional = true, features = [] }
tauri-plugin-window-state = { version = "2.5", optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }
tauri-plugin-opener = { version = "2.7", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Use the webview engine already linked by Tauri; no hosted-page IPC or notification plugin.
webkit2gtk = { version = "2.0", features = ["v2_40"], optional = true }
jsc = { package = "javascriptcore-rs", version = "1.1", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
